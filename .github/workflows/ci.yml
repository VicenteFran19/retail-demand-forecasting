name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar dataset sintetico (para que los tests tengan datos)
        run: python data/generate_data.py

      - name: Entrenar modelo (necesario para tests de la API que cargan el modelo)
        run: python src/train.py

      - name: Correr tests con pytest
        run: python -m pytest tests/ -v

      - name: Verificar que la imagen Docker construye correctamente
        run: docker build -t retail-forecasting:ci .
